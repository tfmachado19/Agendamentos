<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de Aulas</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  nav button { background:transparent; color:#fff; border:1px solid #fff6; border-radius:6px; padding:6px 10px; cursor:pointer; }
  nav button.active { background:#fff; color:var(--accent); }
  main { padding:16px; max-width:1200px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  input, select { padding:7px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
  button.link { background:none; border:0; color:var(--danger); cursor:pointer; }
  .msg { margin-top:10px; font-size:14px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  .grid-wrap { overflow-x:auto; }
  table.grid { border-collapse:collapse; width:100%; min-width:600px; }
  .grid th, .grid td { border:1px solid var(--line); padding:0; font-size:12px; vertical-align:top; }
  .grid th { background:#eef2f7; padding:6px; position:sticky; top:0; }
  .grid td.time { width:56px; text-align:center; color:var(--muted); padding:4px; }
  .grid td.slot { height:28px; }
  .block { background:#dbeafe; border-left:3px solid var(--accent); padding:3px 5px; height:100%; }
  .block b { display:block; }
  table.list { width:100%; border-collapse:collapse; font-size:14px; }
  .list th, .list td { text-align:left; padding:6px; border-bottom:1px solid var(--line); }
  .free { display:inline-block; background:#dcfce7; color:#166534; border-radius:12px; padding:2px 8px; margin:2px; font-size:12px; }
  .grid td.indisp { background:repeating-linear-gradient(45deg,#f1f2f4,#f1f2f4 4px,#e5e7eb 4px,#e5e7eb 8px); }
  .dia-disp { border-bottom:1px solid var(--line); padding:8px 0; }
  .dia-disp b { display:inline-block; width:80px; }
  .faixa { display:inline-block; background:#eef2f7; border-radius:12px; padding:2px 8px; margin:2px; font-size:13px; }
  .hidden { display:none; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  ul { padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1>📅 Agenda de Aulas Particulares</h1>
  <nav>
    <button data-tab="agenda" class="active">Agenda do dia</button>
    <button data-tab="novo">Novo agendamento</button>
    <button data-tab="disp">Disponibilidade</button>
    <button data-tab="cadastros">Cadastros</button>
  </nav>
</header>

<main>
  <!-- AGENDA -->
  <section id="tab-agenda">
    <div class="card row">
      <label>Dia <input type="date" id="dia"></label>
      <label>Ver por
        <select id="visao"><option value="sala">Sala</option><option value="professor">Professor</option></select>
      </label>
    </div>
    <div class="card grid-wrap"><table class="grid" id="grade"></table></div>
    <div class="card">
      <h3 style="margin-top:0">Lista do dia</h3>
      <table class="list" id="lista"></table>
    </div>
  </section>

  <!-- NOVO -->
  <section id="tab-novo" class="hidden">
    <div class="card">
      <div class="row">
        <label>Data <input type="date" id="f-data"></label>
        <label>Início <select id="f-inicio"></select></label>
        <label>Duração
          <select id="f-dur"></select>
        </label>
        <label>Aluno <select id="f-aluno"></select></label>
        <label>Professor <select id="f-prof"></select></label>
        <label>Sala <select id="f-sala"></select></label>
        <button class="primary" id="salvar">Agendar</button>
      </div>
      <div class="msg" id="msg"></div>
      <p style="font-size:14px">Salas livres neste horário: <span id="livres"></span></p>
      <p style="font-size:14px">Professores livres neste horário: <span id="profsLivres"></span></p>
    </div>
  </section>

  <!-- DISPONIBILIDADE -->
  <section id="tab-disp" class="hidden">
    <div class="card">
      <p style="margin-top:0;font-size:14px;color:var(--muted)">Cada professor marca os horários em que pode dar aula.
        Só é possível agendar dentro desses horários.</p>
      <label style="max-width:260px">Professor <select id="d-prof"></select></label>
      <div id="d-dias"></div>
    </div>
  </section>

  <!-- CADASTROS -->
  <section id="tab-cadastros" class="hidden">
    <div class="cols">
      <div class="card" data-entidade="professores"><h3>Professores</h3></div>
      <div class="card" data-entidade="salas"><h3>Salas</h3></div>
      <div class="card" data-entidade="alunos"><h3>Alunos</h3></div>
    </div>
  </section>
</main>

<script>
// ---------- Dados ----------
const hoje = new Date().toLocaleDateString("sv-SE"); // AAAA-MM-DD no fuso local
function f(inicio, fim) { return { inicio, fim }; }
const exemplo = {
  // disp: horários disponíveis por dia da semana (0 = domingo … 6 = sábado)
  professores: [
    {id:1,nome:"Ana (Matemática)",disp:{1:[f("13:00","18:00")],3:[f("13:00","18:00")],5:[f("13:00","18:00")]}},
    {id:2,nome:"Bruno (Inglês)",disp:{1:[f("14:00","16:00"),f("19:00","22:00")],2:[f("19:00","22:00")],4:[f("19:00","22:00")]}},
    {id:3,nome:"Carla (Piano)",disp:{2:[f("13:00","22:00")],3:[f("13:00","22:00")],4:[f("13:00","22:00")]}},
  ],
  salas: [{id:1,nome:"Sala 1"},{id:2,nome:"Sala 2"},{id:3,nome:"Sala 3"}],
  alunos: [{id:1,nome:"João"},{id:2,nome:"Maria"},{id:3,nome:"Pedro"},{id:4,nome:"Luiza"}],
  aulas: [
    {id:1,data:hoje,inicio:"14:00",fim:"15:30",aluno:3,professor:3,sala:3},
    {id:2,data:hoje,inicio:"19:00",fim:"20:00",aluno:2,professor:2,sala:1},
  ],
};
const CHAVE = "agenda-db-v2";
let db;
try { db = JSON.parse(localStorage.getItem(CHAVE)) || exemplo; } catch { db = exemplo; }
const salvarDb = () => { try { localStorage.setItem(CHAVE, JSON.stringify(db)); } catch {} };
const novoId = lista => Math.max(0, ...lista.map(x => x.id)) + 1;
const nome = (lista, id) => (db[lista].find(x => x.id === id) || {nome:"?"}).nome;

// ---------- Horários ----------
const min = h => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const ABRE = 13 * 60, FECHA = 22 * 60, PASSO = 30; // só tarde e noite
const DURACAO_MINIMA = 60, DURACAO_MAXIMA = 240; // mínimo 1h, depois de 30 em 30 min
const SALA_AUTO = 0; // "qualquer sala livre"
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const diaSemana = data => new Date(data + "T12:00").getDay();
const horarios = (de, ate) => { const l = []; for (let t = de; t <= ate; t += PASSO) l.push(hhmm(t)); return l; };
const faixasDoDia = (profId, data) => ((db.professores.find(p => p.id === profId) || {}).disp || {})[diaSemana(data)] || [];
// O professor está disponível se o horário inteiro cabe numa das faixas dele naquele dia
const disponivel = (profId, data, inicio, fim) =>
  faixasDoDia(profId, data).some(r => min(r.inicio) <= min(inicio) && min(fim) <= min(r.fim));
// Dois horários se sobrepõem se um começa antes do outro terminar
const sobrepoe = (a, b) => min(a.inicio) < min(b.fim) && min(b.inicio) < min(a.fim);

function conflitos(nova) {
  const erros = [];
  db.aulas.filter(a => a.data === nova.data && sobrepoe(a, nova)).forEach(a => {
    const quando = `${a.inicio}–${a.fim}`;
    if (a.professor === nova.professor) erros.push(`Professor ${nome("professores", a.professor)} já tem aula ${quando}.`);
    if (a.sala === nova.sala) erros.push(`${nome("salas", a.sala)} já está ocupada ${quando}.`);
    if (a.aluno === nova.aluno) erros.push(`Aluno ${nome("alunos", a.aluno)} já tem aula ${quando}.`);
  });
  return erros;
}

// ---------- Abas ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== "tab-" + b.dataset.tab));
  renderTudo();
});

// ---------- Agenda ----------
const $ = id => document.getElementById(id);
$("dia").value = hoje; $("f-data").value = hoje;
$("dia").onchange = $("visao").onchange = () => renderAgenda();

function renderAgenda() {
  const dia = $("dia").value, visao = $("visao").value;
  const colunas = visao === "sala" ? db.salas : db.professores;
  const aulas = db.aulas.filter(a => a.data === dia).sort((a, b) => min(a.inicio) - min(b.inicio));

  let html = "<tr><th></th>" + colunas.map(c => `<th>${c.nome}</th>`).join("") + "</tr>";
  const ocupado = {}; // células cobertas por rowspan
  for (let t = ABRE; t < FECHA; t += PASSO) {
    html += `<tr><td class="time">${t % 60 === 0 ? hhmm(t) : ""}</td>`;
    colunas.forEach(c => {
      const chave = c.id + "-" + t;
      if (ocupado[chave]) return;
      const aula = aulas.find(a => a[visao] === c.id && min(a.inicio) >= t && min(a.inicio) < t + PASSO);
      if (aula) {
        const span = Math.ceil((min(aula.fim) - t) / PASSO);
        for (let k = 1; k < span; k++) ocupado[c.id + "-" + (t + k * PASSO)] = true;
        const extra = visao === "sala" ? nome("professores", aula.professor) : nome("salas", aula.sala);
        html += `<td class="slot" rowspan="${span}"><div class="block"><b>${nome("alunos", aula.aluno)}</b>${extra}<br>${aula.inicio}–${aula.fim}</div></td>`;
      } else {
        const indisp = visao === "professor" && !disponivel(c.id, dia, hhmm(t), hhmm(t + PASSO));
        html += `<td class="slot${indisp ? " indisp" : ""}"></td>`;
      }
    });
    html += "</tr>";
  }
  $("grade").innerHTML = html;

  $("lista").innerHTML = aulas.length
    ? "<tr><th>Horário</th><th>Aluno</th><th>Professor</th><th>Sala</th><th></th></tr>" +
      aulas.map(a => `<tr><td>${a.inicio}–${a.fim}</td><td>${nome("alunos", a.aluno)}</td><td>${nome("professores", a.professor)}</td><td>${nome("salas", a.sala)}</td><td><button class="link" data-cancelar="${a.id}">cancelar</button></td></tr>`).join("")
    : "<tr><td>Nenhuma aula neste dia.</td></tr>";
  document.querySelectorAll("[data-cancelar]").forEach(b => b.onclick = () => {
    if (!confirm("Cancelar esta aula?")) return;
    db.aulas = db.aulas.filter(a => a.id !== Number(b.dataset.cancelar)); salvarDb(); renderAgenda();
  });
}

// ---------- Novo agendamento ----------
const opcoes = lista => db[lista].map(x => `<option value="${x.id}">${x.nome}</option>`).join("");
function lerForm() {
  const inicio = $("f-inicio").value;
  return { data: $("f-data").value, inicio, fim: hhmm(min(inicio) + Number($("f-dur").value)),
           aluno: Number($("f-aluno").value), professor: Number($("f-prof").value), sala: Number($("f-sala").value) };
}
// Durações: 1h, 1h30, 2h, ... até 4h
const rotulo = m => Math.floor(m / 60) + "h" + (m % 60 ? m % 60 : "");
let durHtml = "";
for (let m = DURACAO_MINIMA; m <= DURACAO_MAXIMA; m += PASSO) durHtml += `<option value="${m}">${rotulo(m)}</option>`;
$("f-dur").innerHTML = durHtml;

const ocupadasNoHorario = f => db.aulas.filter(a => a.data === f.data && sobrepoe(a, f));
const salasLivres = f => db.salas.filter(s => !ocupadasNoHorario(f).some(a => a.sala === s.id));

function renderLivres() {
  if (!$("f-inicio").value) return;
  const f = lerForm();
  const doHorario = ocupadasNoHorario(f);
  const livre = (lista, campo) => db[lista].filter(x => !doHorario.some(a => a[campo] === x.id))
    .map(x => `<span class="free">${x.nome}</span>`).join("") || "<em>nenhum(a)</em>";
  $("livres").innerHTML = livre("salas", "sala");
  $("profsLivres").innerHTML = db.professores
    .filter(p => disponivel(p.id, f.data, f.inicio, f.fim) && !doHorario.some(a => a.professor === p.id))
    .map(p => `<span class="free">${p.nome}</span>`).join("") || "<em>nenhum</em>";
}
["f-data", "f-inicio", "f-dur"].forEach(id => $(id).onchange = renderLivres);
$("f-inicio").innerHTML = horarios(ABRE, FECHA - DURACAO_MINIMA).map(h => `<option${h === "14:00" ? " selected" : ""}>${h}</option>`).join("");

$("salvar").onclick = () => {
  const f = lerForm(), msg = $("msg");
  if (!f.data || !f.inicio || !f.aluno || !f.professor) { msg.className = "msg err"; msg.textContent = "Preencha todos os campos."; return; }
  const dur = min(f.fim) - min(f.inicio);
  if (dur < DURACAO_MINIMA || dur % PASSO) { msg.className = "msg err"; msg.textContent = "A aula deve ter no mínimo 1h, aumentando de 30 em 30 min."; return; }
  if (f.sala === SALA_AUTO) {
    const livre = salasLivres(f)[0];
    if (!livre) { msg.className = "msg err"; msg.textContent = "⚠️ Nenhuma sala livre neste horário."; return; }
    f.sala = livre.id;
  }
  if (min(f.inicio) < ABRE || min(f.fim) > FECHA) { msg.className = "msg err"; msg.textContent = `A aula precisa estar entre ${hhmm(ABRE)} e ${hhmm(FECHA)}.`; return; }
  if (!disponivel(f.professor, f.data, f.inicio, f.fim)) {
    const faixas = faixasDoDia(f.professor, f.data).map(r => `${r.inicio}–${r.fim}`).join(", ") || "nenhum horário";
    msg.className = "msg err"; msg.textContent = `⚠️ ${nome("professores", f.professor)} não está disponível nesse horário. Disponível na ${DIAS[diaSemana(f.data)].toLowerCase()}: ${faixas}.`; return;
  }
  const erros = conflitos(f);
  if (erros.length) { msg.className = "msg err"; msg.innerHTML = "⚠️ Não foi possível agendar:<br>" + erros.join("<br>"); return; }
  db.aulas.push({ id: novoId(db.aulas), ...f }); salvarDb();
  msg.className = "msg ok"; msg.textContent = `✅ Aula agendada: ${f.data} ${f.inicio}–${f.fim}, ${nome("salas", f.sala)}.`;
  renderLivres();
};

// ---------- Cadastros ----------
function renderCadastros() {
  document.querySelectorAll("[data-entidade]").forEach(card => {
    const ent = card.dataset.entidade;
    card.innerHTML = `<h3>${card.querySelector("h3").textContent}</h3>
      <ul>${db[ent].map(x => `<li>${x.nome} <button class="link" data-del="${x.id}">remover</button></li>`).join("")}</ul>
      <div class="row"><input placeholder="Nome"><button class="primary">Adicionar</button></div>`;
    card.querySelector("button.primary").onclick = () => {
      const inp = card.querySelector("input"), n = inp.value.trim();
      if (!n) return;
      db[ent].push({ id: novoId(db[ent]), nome: n, ...(ent === "professores" ? { disp: {} } : {}) }); salvarDb(); renderTudo();
    };
    card.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const id = Number(b.dataset.del), campo = {professores:"professor", salas:"sala", alunos:"aluno"}[ent];
      if (db.aulas.some(a => a[campo] === id)) return alert("Existe aula agendada com este cadastro. Cancele as aulas antes.");
      db[ent] = db[ent].filter(x => x.id !== id); salvarDb(); renderTudo();
    });
  });
}

// ---------- Disponibilidade ----------
$("d-prof").onchange = () => renderDisp();
function renderDisp() {
  const prof = db.professores.find(p => p.id === Number($("d-prof").value));
  if (!prof) { $("d-dias").innerHTML = "<p>Cadastre um professor primeiro.</p>"; return; }
  prof.disp = prof.disp || {};
  const opts = (sel, de, ate) => horarios(de, ate).map(h => `<option${h === sel ? " selected" : ""}>${h}</option>`).join("");
  $("d-dias").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d => `
    <div class="dia-disp" data-dia="${d}">
      <b>${DIAS[d]}</b>
      ${(prof.disp[d] || []).map((r, i) => `<span class="faixa">${r.inicio}–${r.fim} <button class="link" data-rm="${i}">✕</button></span>`).join("") || '<span style="color:var(--muted);font-size:13px">indisponível</span>'}
      <div class="row" style="margin-top:4px">
        <select class="de">${opts("13:00", ABRE, FECHA - DURACAO_MINIMA)}</select> até
        <select class="ate">${opts("18:00", ABRE + DURACAO_MINIMA, FECHA)}</select>
        <button class="primary add">+ adicionar</button>
      </div>
    </div>`).join("");
  document.querySelectorAll(".dia-disp").forEach(div => {
    const d = div.dataset.dia;
    div.querySelector(".add").onclick = () => {
      const nova = f(div.querySelector(".de").value, div.querySelector(".ate").value);
      if (min(nova.fim) - min(nova.inicio) < DURACAO_MINIMA) return alert("O período precisa ter pelo menos 1h.");
      const lista = prof.disp[d] || [];
      if (lista.some(r => sobrepoe(r, nova))) return alert("Esse período se sobrepõe a outro já cadastrado.");
      prof.disp[d] = [...lista, nova].sort((a, b) => min(a.inicio) - min(b.inicio)); salvarDb(); renderDisp();
    };
    div.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
      prof.disp[d].splice(Number(b.dataset.rm), 1); salvarDb(); renderDisp();
    });
  });
}

function renderTudo() {
  $("f-aluno").innerHTML = opcoes("alunos");
  $("f-prof").innerHTML = opcoes("professores");
  $("f-sala").innerHTML = `<option value="${SALA_AUTO}">Qualquer sala livre</option>` + opcoes("salas");
  const profSel = $("d-prof").value;
  $("d-prof").innerHTML = opcoes("professores");
  if (db.professores.some(p => String(p.id) === profSel)) $("d-prof").value = profSel;
  renderAgenda(); renderLivres(); renderCadastros(); renderDisp();
}
renderTudo();
</script>
</body>
</html>
